# ← **SỬA 1**: Bỏ version (deprecated)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - app-network

  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8090:8090"
    env_file:
      - ./api_gateway/.env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3098:3098"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
      - api_gateway
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:16
    container_name: custom-role-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_custom_role_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_custom_role_data:
