# Extension field — dùng YAML anchor để tái sử dụng logging config cho tất cả service
# max-size: 10m + max-file: 5 = tối đa 50MB log/container, tránh tràn ổ cứng
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ─── Application services ──────────────────────────────────────

  nginx_w:
    image: nginx:alpine
    logging: *default-logging
    # nginx:alpine mặc định symlink access.log → /dev/stdout (pipe)
    # Promtail không đọc được pipe, chỉ đọc được file thật
    # → xóa symlink, tạo file thật trước khi nginx start
    command: >
      sh -c "rm -f /var/log/nginx/access.log /var/log/nginx/error.log
             touch /var/log/nginx/access.log /var/log/nginx/error.log
             nginx -g 'daemon off;'"
    ports:
      - "8082:80"
      # port 8080 (stub_status) không publish ra host → chỉ nội bộ app-network
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx   # shared với promtail_w
    depends_on:
      frontend_w:
        condition: service_healthy
      backend-1_w:
        condition: service_started
      backend-2_w:
        condition: service_started
      backend-3_w:
        condition: service_started
      chatbot_w:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  nginx-exporter_w:
    image: nginx/nginx-prometheus-exporter:1.3.0
    logging: *default-logging
    command:
      - -nginx.scrape-uri=http://nginx_w:8080/stub_status
    expose:
      - "9113"
    depends_on:
      - nginx_w
    restart: unless-stopped
    networks:
      - app-network

  backend-1_w:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    container_name: dashboard-web-backend-1_w
    logging: *default-logging
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  backend-2_w:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    container_name: dashboard-web-backend-2_w
    logging: *default-logging
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  backend-3_w:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    container_name: dashboard-web-backend-3_w
    logging: *default-logging
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  frontend_w:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    logging: *default-logging
    expose:
      - "3022"
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3022/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  chatbot_w:
    build:
      context: ./Chatboy
      dockerfile: Dockerfile
    container_name: chatbot_dashboard_rating_w
    logging: *default-logging
    expose:
      - "8010"
    volumes:
      - ./Chatboy/data/dashboard/rating/values:/app/data/dashboard/rating/values
      - ./Chatboy/logs:/app/logs
    env_file:
      - ./Chatboy/.env
    environment:
      - PORT=8010
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Monitoring stack ──────────────────────────────────────────
  #
  # Flow:
  #   nginx access.log (JSON)
  #       └── promtail_w ──────────────> loki_w
  #                                         └── grafana_w
  #   nginx-exporter_w (stub_status) ──> prometheus_w ──> grafana_w
  #   cadvisor_w (container metrics) ──> prometheus_w ──> grafana_w

  # Prometheus: scrape metric từ nginx-exporter và cadvisor, lưu time-series
  prometheus_w:
    image: prom/prometheus:v2.52.0
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d   # giữ data 15 ngày
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    restart: unless-stopped
    networks:
      - app-network

  # Loki: lưu trữ log (nhận từ Promtail, Grafana query vào đây)
  loki_w:
    image: grafana/loki:3.0.0
    logging: *default-logging
    command: -config.file=/etc/loki/local-config.yaml
    expose:
      - "3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - app-network

  # Promtail: đọc access.log của nginx, parse JSON, đẩy vào Loki
  promtail_w:
    image: grafana/promtail:3.0.0
    logging: *default-logging
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki_w
      - nginx_w
    restart: unless-stopped
    networks:
      - app-network

  # cAdvisor: expose CPU/RAM/Network của từng container dưới dạng Prometheus metric
  # privileged + volume mount vào /sys và /var/lib/docker là bắt buộc để nó đọc được cgroup
  cadvisor_w:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    logging: *default-logging
    privileged: true
    user: root
    command:
      - --docker_only=true
      - --store_container_labels=true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - app-network

  # Grafana: UI duy nhất để xem — query cả Prometheus lẫn Loki
  grafana_w:
    image: grafana/grafana:11.0.0
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus_w
      - loki_w
    restart: unless-stopped
    networks:
      - app-network

volumes:
  nginx_logs:       # shared giữa nginx_w và promtail_w
  prometheus_data:  # time-series metric, persist qua restart
  loki_data:        # log storage, persist qua restart
  grafana_data:     # dashboard config, persist qua restart

networks:
  app-network:
    driver: bridge
