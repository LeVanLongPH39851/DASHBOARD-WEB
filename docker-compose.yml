services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network
      
  backend:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3022"
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
