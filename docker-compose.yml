# ← **SỬA 1**: Bỏ version (deprecated)

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped
    networks:
      - app-network
      
  backend-1:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    container_name: dashboard-web-backend-1
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  backend-2:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    container_name: dashboard-web-backend-2
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  backend-3:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    container_name: dashboard-web-backend-3
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3022"
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
