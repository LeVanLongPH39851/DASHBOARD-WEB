services:
  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started
      backend-3:
        condition: service_started
      chatbot:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  backend-1:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    container_name: dashboard-web-backend-1
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  backend-2:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    container_name: dashboard-web-backend-2
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  backend-3:
    build:
      context: ./backend_superset
      dockerfile: Dockerfile
    container_name: dashboard-web-backend-3
    expose:
      - "5000"
    env_file:
      - ./backend_superset/.env
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3022"
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3022/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  chatbot:
    build:
      context: ./Chatboy
      dockerfile: Dockerfile
    container_name: chatbot_dashboard_rating
    expose:
      - "8010"
    volumes:
      - ./Chatboy/data/dashboard/rating/values:/app/data/dashboard/rating/values
      - ./Chatboy/logs:/app/logs
    env_file:
      - ./Chatboy/.env
    environment:
      - PORT=8010
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge
