apiVersion: 1

# Contact point — nơi Grafana gửi notification đến
contactPoints:
  - orgId: 1
    name: telegram-endpoint
    receivers:
      - uid: telegram-receiver
        type: telegram
        settings:
          bottoken: '8615385595:AAEvKvPJ9LaoDor654rJCv66AiOaydHd-DM'
          chatid: '-1004473506382'
          message_thread_id: '14'
          parse_mode: HTML
          message: |-
            {{ if eq .Status "firing" }}<b>🔴 [FIRING] {{ .CommonLabels.alertname }}</b>{{ else }}<b>✅ [RESOLVED] {{ .CommonLabels.alertname }}</b>{{ end }}

            {{ range .Alerts }}
            <b>Instance:</b> <code>{{ .Labels.instance }}</code>
            <b>Severity:</b> <code>{{ .Labels.severity }}</code>
            <b>Description:</b> {{ .Annotations.description }}
            {{ end }}
          disableResolveMessage: false

# Notification policy — rule nào dùng contact point nào
policies:
  - orgId: 1
    receiver: telegram-endpoint   # default receiver cho tất cả alert
