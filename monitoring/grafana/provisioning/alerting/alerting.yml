apiVersion: 1

# Contact point — nơi Grafana gửi notification đến
contactPoints:
  - orgId: 1
    name: telegram-endpoint
    receivers:
      - uid: telegram-receiver
        type: telegram
        settings:
          bottoken: '8615385595:AAEvKvPJ9LaoDor654rJCv66AiOaydHd-DM'
          chatid: '-1004473506382'
          message_thread_id: '14'
          parse_mode: HTML
          message: |-
            {{ if eq .Status "firing" }}<b>🔴 [Có lỗi] {{ .CommonLabels.alertname }}</b>{{ else }}<b>✅ [Đã hết lỗi] {{ .CommonLabels.alertname }}</b>{{ end }}

            {{ range .Alerts -}}
            <b>Container:</b> <code>{{ .Labels.container_label_com_docker_compose_service }}</code>
            <b>Mức độ:</b> <code>{{ if eq .Labels.severity "critical" }}Nghiêm trọng{{ else if eq .Labels.severity "warning" }}Cảnh báo{{ else }}{{ .Labels.severity }}{{ end }}</code>
            <b>Mô tả:</b> {{ .Annotations.description }}
            {{ end }}
          disableResolveMessage: false

  - orgId: 1
    name: telegram-no-resolved
    receivers:
      - uid: telegram-receiver-no-resolved
        type: telegram
        settings:
          bottoken: '8615385595:AAEvKvPJ9LaoDor654rJCv66AiOaydHd-DM'
          chatid: '-1004473506382'
          message_thread_id: '14'
          parse_mode: HTML
          message: |-
            <b>🔴 [CẢNH BÁO SỰ KIỆN] {{ .CommonLabels.alertname }}</b>

            {{ range .Alerts -}}
            <b>Container:</b> <code>{{ .Labels.container_label_com_docker_compose_service }}</code>
            <b>Mức độ:</b> <code>{{ if eq .Labels.severity "critical" }}Nghiêm trọng{{ else if eq .Labels.severity "warning" }}Cảnh báo{{ else }}{{ .Labels.severity }}{{ end }}</code>
            <b>Mô tả:</b> {{ .Annotations.description }}
            {{ end }}
          disableResolveMessage: true
  - orgId: 1
    name: telegram-no-resolved-container
    receivers:
      - uid: telegram-receiver-no-resolved-container
        type: telegram
        settings:
          bottoken: '8615385595:AAEvKvPJ9LaoDor654rJCv66AiOaydHd-DM'
          chatid: '-1004473506382'
          message_thread_id: '14'
          parse_mode: HTML
          message: |-
            <b>🔴 [Container bị down] {{ .CommonLabels.alertname }}</b>

            {{ range .Alerts -}}
            <b>Container:</b> <code>{{ .Labels.container_label_com_docker_compose_service }}</code>
            <b>Mức độ:</b> <code>Nghiêm trọng</code>
            <b>Mô tả:</b> {{ .Annotations.description }}
            {{ end }}
          disableResolveMessage: true


policies:
  - orgId: 1
    receiver: telegram-endpoint   # default receiver cho tất cả alert
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 10m
    repeat_interval: 24h
    routes:
      - receiver: telegram-no-resolved-container
        matchers:
          - alert_type = container
        group_by: ['...']
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
      - receiver: telegram-no-resolved
        matchers:
          - alert_type = event
        group_wait: 0s        # Có lỗi là bắn Telegram luôn lập tức
        group_interval: 1m    # Nếu lỗi dồn dập chỉ gom trong 1 phút
        repeat_interval: 24h  # Kệ nó (vì event dập ngay nên không bao giờ dính repeat)

# Alert rules are provisioned from rules.yml.