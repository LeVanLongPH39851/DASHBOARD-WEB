apiVersion: 1

groups:
  - orgId: 1
    name: nginx-gateway-alerts
    folder: Alerts
    interval: 30s
    rules:

      # ── Alert 1a: 429 chatbot ─────────────────────────────────
      - uid: alert-429-chatbot
        title: "429 Rate Limit - Chatbot"
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum(count_over_time({job="nginx-gateway", status="429"} | json | uri=~"^/api/query" [2m])) or vector(0)'
              queryType: instant
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }
                  operator: { type: and }
                  query: { params: [B] }
        for: 0s
        labels:
          severity: warning
          alert_type: event
        annotations:
          summary: "Chatbot bị rate limit nhiều bất thường"
          description: "{{ $values.B.Value | printf \"%.0f\" }} request /api/query bị 429 trong 2 phút qua (ngưỡng: 5)."

      # ── Alert 1b: 429 superset ────────────────────────────────
      - uid: alert-429-superset
        title: "429 Rate Limit - Superset"
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum(count_over_time({job="nginx-gateway", status="429"} | json | uri=~"^/api/superset" [2m])) or vector(0)'
              queryType: instant
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator: { type: gt, params: [50] }
                  operator: { type: and }
                  query: { params: [B] }
        for: 1m
        labels:
          severity: warning
          alert_type: event
        annotations:
          summary: "Superset bị rate limit bất thường"
          description: "{{ $values.B.Value | printf \"%.0f\" }} request /api/superset bị 429 trong 2 phút qua (ngưỡng: 50)."

      # ── Alert 3a: Backend errors — Superset ───────────────────
      - uid: alert-backend-error-superset
        title: "Backend Errors (5xx) - Superset"
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum(count_over_time({job="nginx-gateway", status=~"5.."} | json | uri=~"^/api/superset" [2m])) or vector(0)'
              queryType: instant
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator: { type: gt, params: [3] }
                  operator: { type: and }
                  query: { params: [B] }
        for: 0s
        labels:
          severity: critical
          alert_type: event
        annotations:
          summary: "Superset đang trả lỗi 5xx"
          description: "{{ $values.B.Value | printf \"%.0f\" }} request /api/superset bị lỗi 5xx trong 2 phút qua (ngưỡng: 3). Kiểm tra backend-1/2/3."

      # ── Alert 3b: Backend errors — Chatbot ────────────────────
      - uid: alert-backend-error-chatbot
        title: "Backend Errors (5xx) - Chatbot"
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum(count_over_time({job="nginx-gateway", status=~"5.."} | json | uri=~"^/api/query" [2m])) or vector(0)'
              queryType: instant
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator: { type: gt, params: [3] }
                  operator: { type: and }
                  query: { params: [B] }
        for: 0s
        labels:
          severity: critical
          alert_type: event
        annotations:
          summary: "Chatbot đang trả lỗi 5xx"
          description: "{{ $values.B.Value | printf \"%.0f\" }} request /api/query bị lỗi 5xx trong 2 phút qua (ngưỡng: 3). Kiểm tra chatbot service."

