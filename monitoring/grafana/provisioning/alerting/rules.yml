apiVersion: 1

# ════════════════════════════════════════════════════════════════
# 1. ALERT RULES
# ════════════════════════════════════════════════════════════════
groups:
  - orgId: 1
    name: nginx-gateway-alerts
    folder: Alerts
    interval: 30s
    rules:

      # ── Alert 1a: 429 chatbot ─────────────────────────────────
      - uid: alert-429-chatbot
        title: "429 Rate Limit - Chatbot"
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum(count_over_time({job="nginx-gateway", status="429"} | json | uri=~"^/api/query" [1m]))'
              queryType: instant
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }
                  operator: { type: and }
                  query: { params: [B] }
        for: 0s
        labels:
          severity: warning
          alert_type: event
        annotations:
          summary: "Chatbot bị rate limit nhiều bất thường"
          description: "{{ $values.B.Value | printf \"%.0f\" }} request /api/query bị 429 trong 1 phút qua (ngưỡng: 5)."

      # ── Alert 1b: 429 superset ────────────────────────────────
      - uid: alert-429-superset
        title: "429 Rate Limit - Superset"
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum(count_over_time({job="nginx-gateway", status="429"} | json | uri=~"^/api/superset" [1m]))'
              queryType: instant
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator: { type: gt, params: [50] }
                  operator: { type: and }
                  query: { params: [B] }
        for: 0s # Giảm xuống 0s để event phát hiện phát bắn ngay
        labels:
          severity: warning
          alert_type: event
        annotations:
          summary: "Superset bị rate limit bất thường"
          description: "{{ $values.B.Value | printf \"%.0f\" }} request /api/superset bị 429 trong 1 phút qua (ngưỡng: 50)."

      # ── Alert 3a: Backend errors — Superset ───────────────────
      - uid: alert-backend-error-superset
        title: "Backend Errors (5xx) - Superset"
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum(count_over_time({job="nginx-gateway", status=~"5.."} | json | uri=~"^/api/superset" [1m]))'
              queryType: instant
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator: { type: gt, params: [3] }
                  operator: { type: and }
                  query: { params: [B] }
        for: 0s
        labels:
          severity: critical
          alert_type: event
        annotations:
          summary: "Superset đang trả lỗi 5xx"
          description: "{{ $values.B.Value | printf \"%.0f\" }} request /api/superset bị lỗi 5xx trong 1 phút qua (ngưỡng: 3). Kiểm tra backend-1/2/3."

      # ── Alert 3b: Backend errors — Chatbot ────────────────────
      - uid: alert-backend-error-chatbot
        title: "Backend Errors (5xx) - Chatbot"
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum(count_over_time({job="nginx-gateway", status=~"5.."} | json | uri=~"^/api/query" [1m]))'
              queryType: instant
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            queryType: ''
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator: { type: gt, params: [3] }
                  operator: { type: and }
                  query: { params: [B] }
        for: 0s
        labels:
          severity: critical
          alert_type: event
        annotations:
          summary: "Chatbot đang trả lỗi 5xx"
          description: "{{ $values.B.Value | printf \"%.0f\" }} request /api/query bị lỗi 5xx trong 1 phút qua (ngưỡng: 3). Kiểm tra chatbot service."

  - orgId: 1
    name: container-health
    folder: Alerts
    interval: 30s
    rules:

      - uid: alert-container-memory-high
        title: "Container memory gần giới hạn"
        condition: A
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '(100 * container_memory_working_set_bytes{job="cadvisor",container_label_com_docker_compose_project="dashboard-web",container_label_com_docker_compose_service=~".+",container_label_com_docker_compose_service!="cadvisor_w"} / container_spec_memory_limit_bytes{job="cadvisor",container_label_com_docker_compose_project="dashboard-web",container_label_com_docker_compose_service=~".+",container_label_com_docker_compose_service!="cadvisor_w"}) > 85 and on (id) container_spec_memory_limit_bytes{job="cadvisor",container_label_com_docker_compose_project="dashboard-web",container_label_com_docker_compose_service=~".+",container_label_com_docker_compose_service!="cadvisor_w"} > 0'
              instant: true
              range: false
              queryType: instant
              refId: A
        for: 5m
        labels:
          severity: critical
          alert_type: container
        annotations:
          summary: "Memory gần giới hạn: {{ $labels.container_label_com_docker_compose_service }}"
          description: "Container {{ $labels.container_label_com_docker_compose_service }} đang dùng {{ $values.A.Value | printf \"%.0f\" }}% memory limit trong ít nhất 5 phút (ngưỡng: 85%)."

      - uid: alert-container-down
        title: "Container bị down"
        condition: A
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '(time() - container_last_seen{job="cadvisor",container_label_com_docker_compose_project="dashboard-web",container_label_com_docker_compose_service=~".+",container_label_com_docker_compose_service!="cadvisor_w"}) > 150'
              instant: true
              range: false
              queryType: instant
              refId: A
        for: 30s
        labels:
          severity: critical
          alert_type: container
        annotations:
          summary: "Container bị down: {{ $labels.container_label_com_docker_compose_service }}"
          description: "Container {{ $labels.container_label_com_docker_compose_service }} không được cAdvisor nhìn thấy trong hơn {{ if $values.A }}{{ $values.A.Value | printf \"%.0f\" }}{{ else }}150+{{ end }} giây."

# ════════════════════════════════════════════════════════════════
# 2. CONTACT POINTS
# ════════════════════════════════════════════════════════════════
contactPoints:
  - orgId: 1
    name: telegram-endpoint
    receivers:
      - uid: telegram-receiver
        type: telegram
        settings:
          bottoken: '8615385595:AAEvKvPJ9LaoDor654rJCv66AiOaydHd-DM'
          chatid: '-1004473506382'
          message_thread_id: '14'
          parse_mode: HTML
          message: |-
            {{ if eq .Status "firing" }}<b>🔴 [Có lỗi] {{ .CommonLabels.alertname }}</b>{{ else }}<b>✅ [Đã hết lỗi] {{ .CommonLabels.alertname }}</b>{{ end }}

            {{ range .Alerts -}}
            <b>Container:</b> <code>{{ .Labels.container_label_com_docker_compose_service }}</code>
            <b>Mức độ:</b> <code>{{ if eq .Labels.severity "critical" }}Nghiêm trọng{{ else if eq .Labels.severity "warning" }}Cảnh báo{{ else }}{{ .Labels.severity }}{{ end }}</code>
            <b>Mô tả:</b> {{ .Annotations.description }}
            {{ end }}
          disableResolveMessage: false

  - orgId: 1
    name: telegram-no-resolved
    receivers:
      - uid: telegram-receiver-no-resolved
        type: telegram
        settings:
          bottoken: '8615385595:AAEvKvPJ9LaoDor654rJCv66AiOaydHd-DM'
          chatid: '-1004473506382'
          message_thread_id: '14'
          parse_mode: HTML
          message: |-
            {{ if eq .Status "firing" -}}
            <b>🔴 [CẢNH BÁO SỰ KIỆN] {{ .CommonLabels.alertname }}</b>

            {{ range .Alerts -}}
            <b>Service:</b> <code>{{ .Labels.job }}</code>
            <b>Mức độ:</b> <code>{{ if eq .Labels.severity "critical" }}Nghiêm trọng{{ else if eq .Labels.severity "warning" }}Cảnh báo{{ else }}{{ .Labels.severity }}{{ end }}</code>
            <b>Mô tả:</b> {{ .Annotations.description }}
            {{ end -}}
            {{- end }}
          disableResolveMessage: true

  - orgId: 1
    name: telegram-no-resolved-container
    receivers:
      - uid: telegram-receiver-no-resolved-container
        type: telegram
        settings:
          bottoken: '8615385595:AAEvKvPJ9LaoDor654rJCv66AiOaydHd-DM'
          chatid: '-1004473506382'
          message_thread_id: '14'
          parse_mode: HTML
          message: |-
            {{ if eq .Status "firing" -}}
            <b>🔴 [Container bị down] {{ .CommonLabels.alertname }}</b>

            {{ range .Alerts -}}
            <b>Container:</b> <code>{{ .Labels.container_label_com_docker_compose_service }}</code>
            <b>Mức độ:</b> <code>Nghiêm trọng</code>
            <b>Mô tả:</b> {{ .Annotations.description }}
            {{ end -}}
            {{- end }}
          disableResolveMessage: true

# ════════════════════════════════════════════════════════════════
# 3. NOTIFICATION POLICIES
# ════════════════════════════════════════════════════════════════
policies:
  - orgId: 1
    receiver: telegram-endpoint
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 10m
    repeat_interval: 24h
    routes:
      - receiver: telegram-no-resolved-container
        matchers:
          - alert_type = container
        group_by: ['...']
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h

      - receiver: telegram-no-resolved
        matchers:
          - alert_type = event
        group_wait: 0s         # Bắn ngay lập tức khi phát hiện spike
        group_interval: 30s    # Cập nhật nhanh trong 30s nếu còn lỗi
        repeat_interval: 24h   # Lỗi event tự dập tắt nên không lo bị lặp lại