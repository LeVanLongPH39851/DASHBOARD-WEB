apiVersion: 1

datasources:
  # Prometheus: nguồn metric (nginx connections, cadvisor CPU/RAM)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus_w:9090
    isDefault: false
    editable: true

  # Loki: nguồn log (nginx access log JSON, query p90/p95/p99)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki_w:3100
    isDefault: true
    editable: true
