# Config dùng để test LOCAL (không qua Docker)
# frontend chạy ở port 5173 (vite dev), backend_superset ở port 5000

events {}

http {
    # ─── Rate limit zones ────────────────────────────────────────
    # chatbot: 1 request/10s mỗi IP  →  rate=6r/m (6 request/phút = 1 mỗi 10s)
    limit_req_zone $binary_remote_addr zone=chatbot_limit:10m rate=6r/m;

    # superset: 10 request/s mỗi IP
    limit_req_zone $binary_remote_addr zone=superset_limit:10m rate=10r/s;

    limit_req_status 429;

    upstream frontend_service {
        server 127.0.0.1:5173;
    }

    upstream backend_superset_service {
        server 127.0.0.1:5000;
    }

    server {
        listen 8080;

        access_log /tmp/nginx-gateway-access.log;
        error_log  /tmp/nginx-gateway-error.log warn;

        # ─── 429 handler cho chatbot ─────────────────────────────────
        # error_page bắt 429 → trả JSON có Retry-After header
        error_page 429 = @chatbot_rate_limited;
        location @chatbot_rate_limited {
            default_type application/json;
            add_header   Retry-After  10 always;
            add_header   Content-Type application/json always;
            return 429 '{"success":false,"error":"Rate limit exceeded. Vui lòng thử lại sau 10 giây.","retry_after":10}';
        }

        # ─── Superset API (10 req/s) ─────────────────────────────
        location /api/superset {
            limit_req zone=superset_limit burst=5 nodelay;

            proxy_pass         http://backend_superset_service/api/superset;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }

        # ─── Doris processlist ──────────────────────────────────────
        location /api/doris/processlist {
            proxy_pass         http://backend_superset_service/api/doris/processlist;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }

        # ─── Kill user requests ─────────────────────────────────────
        location /api/kill-user {
            proxy_pass         http://backend_superset_service/api/kill-user;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }

        # ─── Chatbot service — 1 req/10s ────────────────────────────
        location /api/query {
            limit_req zone=chatbot_limit nodelay;

            proxy_pass         http://100.100.11.2:8010/api/query;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # ─── Health check ────────────────────────────────────────────
        location /api/health {
            proxy_pass         http://backend_superset_service/api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ─── Frontend (catch-all) ────────────────────────────────────
        location / {
            proxy_pass         http://frontend_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
